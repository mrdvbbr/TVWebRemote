<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Apple Home Screen & PWA Configuration -->
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="apple-touch-icon-precomposed" href="/icon.png">
    <meta name="apple-mobile-web-app-title" content="TV Remote">
    <meta name="application-name" content="TV Remote">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <title>TV Remote</title>
    <style>
        :root {
            --bg-canvas: #070709;
            --chassis-bg: #121217;
            --surface-primary: #1c1c24;
            --surface-hover: #262632;
            --surface-active: #15151c;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.16);
            --accent-blue: #0a84ff;
            --accent-green: #30d158;
            --accent-red: #ff453a;
            --text-primary: #ffffff;
            --text-secondary: #868691;
            --text-tertiary: #52525d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top, 12px) + 8px) 16px calc(env(safe-area-inset-bottom, 14px) + 10px) 16px;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(10, 132, 255, 0.12), transparent 70%),
                radial-gradient(ellipse 60% 40% at 50% 110%, rgba(48, 209, 88, 0.06), transparent 70%);
        }

        /* Remote Chassis Container - Scaled to fit 100dvh perfectly without scrolling */
        .remote-frame {
            width: 100%;
            max-width: 350px;
            height: 100%;
            max-height: 740px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        /* 1. Header Bar */
        .nav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
        }

        .device-info {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .status-beacon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse-ring 2.8s infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }

        .device-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pill-btn-subtle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 5px 11px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.12s ease;
        }

        .pill-btn-subtle.active {
            background: rgba(10, 132, 255, 0.16);
            border-color: rgba(10, 132, 255, 0.4);
            color: #60a5fa;
        }

        .power-round-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(180deg, rgba(255, 69, 58, 0.22) 0%, rgba(30, 15, 17, 0.6) 100%);
            border: 1px solid rgba(255, 69, 58, 0.35);
            color: var(--accent-red);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.08s ease, background 0.08s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
        }

        .power-round-btn:active {
            transform: scale(0.9);
            background: rgba(255, 69, 58, 0.4);
        }

        /* 2. Apple Siri Remote Touchpad & Clickpad */
        .clickpad-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 4px 0;
            position: relative;
        }

        .clickpad-surface {
            width: 232px;
            height: 232px;
            border-radius: 50%;
            background: radial-gradient(circle at 48% 48%, #252530 0%, #17171f 100%);
            border: 1px solid rgba(255, 255, 255, 0.11);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.22),
                inset 0 -3px 6px rgba(0, 0, 0, 0.65),
                0 16px 40px rgba(0, 0, 0, 0.7);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none; /* Allows swipe gesture handling */
        }

        /* Outer Click Zones */
        .clickpad-zone {
            position: absolute;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            transition: color 0.06s ease, transform 0.06s ease;
        }

        .clickpad-zone:active, .clickpad-zone.pressed {
            color: #ffffff;
        }

        .zone-up {
            top: 0; left: 0; right: 0; height: 72px;
            align-items: flex-start; padding-top: 13px;
        }
        .zone-up:active, .zone-up.pressed { transform: translateY(-3px); }

        .zone-down {
            bottom: 0; left: 0; right: 0; height: 72px;
            align-items: flex-end; padding-bottom: 13px;
        }
        .zone-down:active, .zone-down.pressed { transform: translateY(3px); }

        .zone-left {
            left: 0; top: 0; bottom: 0; width: 72px;
            justify-content: flex-start; padding-left: 13px;
        }
        .zone-left:active, .zone-left.pressed { transform: translateX(-3px); }

        .zone-right {
            right: 0; top: 0; bottom: 0; width: 72px;
            justify-content: flex-end; padding-right: 13px;
        }
        .zone-right:active, .zone-right.pressed { transform: translateX(3px); }

        /* Concave Center OK Button */
        .clickpad-center-dish {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle at 45% 42%, #2c2c39 0%, #1b1b24 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                inset 0 2px 5px rgba(255, 255, 255, 0.12),
                inset 0 -2px 6px rgba(0, 0, 0, 0.7),
                0 4px 14px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.08s ease, background 0.08s ease, color 0.08s ease;
        }

        .clickpad-center-dish:active, .clickpad-center-dish.pressed {
            transform: scale(0.92);
            background: #14141c;
            color: var(--accent-blue);
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.85);
        }

        /* 3. Primary Controls: Navigation & Rocker Cluster */
        .controls-cluster {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 12px;
            align-items: center;
        }

        .buttons-grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Tactile Button Surface */
        .tactile-btn {
            height: 50px;
            border-radius: 19px;
            background: linear-gradient(180deg, #24242f 0%, #191922 100%);
            border: 1px solid var(--border-subtle);
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 4px 10px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #dcdcde;
            font-size: 11px;
            font-weight: 600;
            gap: 3px;
            cursor: pointer;
            transition: transform 0.08s ease, background 0.08s ease;
        }

        .tactile-btn:active {
            transform: scale(0.91);
            background: #13131a;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.75);
        }

        /* Apple TV Vertical Volume Rocker */
        .volume-column {
            display: flex;
            justify-content: center;
        }

        .vol-rocker {
            width: 100%;
            max-width: 90px;
            height: 110px;
            border-radius: 24px;
            background: linear-gradient(180deg, #24242f 0%, #191922 100%);
            border: 1px solid var(--border-subtle);
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                0 6px 14px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .vol-part {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.08s ease;
            outline: none;
        }

        .vol-part:active {
            background: rgba(255, 255, 255, 0.09);
        }

        .vol-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 0 12px;
        }

        /* 4. Quick Channels Floating Bar */
        .channels-bar {
            height: 50px;
            border-radius: 19px;
            background: linear-gradient(135deg, rgba(10, 132, 255, 0.14) 0%, rgba(88, 86, 214, 0.16) 100%);
            border: 1px solid rgba(10, 132, 255, 0.35);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            cursor: pointer;
            transition: transform 0.08s ease, background 0.08s ease;
        }

        .channels-bar:active {
            transform: scale(0.96);
            background: rgba(10, 132, 255, 0.22);
        }

        .channels-label-group {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .channels-count-badge {
            background: var(--accent-blue);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
        }

        /* 5. Quick App Launch Dock */
        .apps-dock {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .app-dock-pill {
            height: 48px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.08s ease, background 0.08s ease;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
        }

        .app-dock-pill:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.1);
        }

        .app-telecom {
            background: linear-gradient(180deg, rgba(10, 132, 255, 0.18) 0%, rgba(15, 25, 45, 0.4) 100%);
            border-color: rgba(10, 132, 255, 0.3);
            color: #60a5fa;
        }

        .app-youtube {
            background: linear-gradient(180deg, rgba(255, 69, 58, 0.18) 0%, rgba(45, 15, 20, 0.4) 100%);
            border-color: rgba(255, 69, 58, 0.3);
            color: var(--accent-red);
        }

        .app-settings {
            color: #94a3b8;
        }

        .app-numpad {
            color: #fbbf24;
        }

        svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* 6. iOS 18 Bottom Sheet Modal */
        .sheet-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 100;
        }

        .sheet-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-height: 82vh;
            background: #14141a;
            border-top: 1px solid var(--border-highlight);
            border-radius: 32px 32px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 101;
            display: flex;
            flex-direction: column;
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 8px);
            box-shadow: 0 -12px 50px rgba(0, 0, 0, 0.75);
        }

        .modal-sheet.visible {
            transform: translateY(0);
        }

        .sheet-grabber {
            width: 36px;
            height: 4px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 2px;
            margin: 10px auto 4px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px 10px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .modal-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        .modal-tabs {
            display: flex;
            gap: 8px;
            padding: 0 18px 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .modal-tabs::-webkit-scrollbar { display: none; }

        .tab-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.12s ease;
        }

        .tab-pill.active {
            background: var(--accent-blue);
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 2px 8px rgba(10, 132, 255, 0.4);
        }

        .search-container {
            padding: 0 18px 10px;
        }

        .search-box {
            width: 100%;
            height: 38px;
            background: #1e1e27;
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 0 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent-blue);
        }

        .channel-scroll {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 4px 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .channel-row {
            background: #1b1b23;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 11px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.08s ease, background 0.08s ease;
        }

        .channel-row:active {
            transform: scale(0.97);
            background: #252533;
            border-color: var(--accent-blue);
        }

        .channel-info-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .channel-digit-tag {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.07);
            color: #93c5fd;
            padding: 3px 8px;
            border-radius: 9px;
            min-width: 40px;
            text-align: center;
        }

        .star-tag {
            background: rgba(245, 158, 11, 0.18);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .channel-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .channel-subtag {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* 7. Numpad Sheet */
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 24px 20px;
            max-width: 320px;
            margin: 0 auto;
            width: 100%;
        }

        .numpad-key {
            height: 56px;
            border-radius: 18px;
            background: #20202a;
            border: 1px solid var(--border-subtle);
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.08s ease, background 0.08s ease;
        }

        .numpad-key:active {
            transform: scale(0.92);
            background: #161620;
            color: var(--accent-blue);
        }

        .numpad-action-key {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* Toast Feedback */
        .toast-pill {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-90px);
            background: rgba(24, 24, 32, 0.94);
            border: 1px solid var(--border-highlight);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 200;
            pointer-events: none;
        }

        .toast-pill.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast-glow-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 6px var(--accent-green);
        }
    </style>
</head>
<body>

<!-- Toast -->
<div id="toast" class="toast-pill">
    <div class="toast-glow-dot"></div>
    <span id="toastText">Tuning...</span>
</div>

<div class="remote-frame">
    <!-- 1. Header Bar -->
    <div class="nav-header">
        <div class="device-info">
            <div class="status-beacon"></div>
            <span class="device-title">Apple TV Remote</span>
        </div>
        <div class="header-actions">
            <div id="audioToggle" class="pill-btn-subtle" onclick="toggleAudioFeedback()">
                <svg viewBox="0 0 24 24" style="width: 13px; height: 13px;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <span id="audioStatusText">Click: Off</span>
            </div>
            <button class="power-round-btn" onclick="sendRemoteKey('power')">
                <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A8.962 8.962 0 0 1 20 12c0 4.97-4.03 9-9 9s-9-4.03-9-9c0-3.12 1.59-5.88 4-7.49L4.58 3.09A10.965 10.965 0 0 0 1 12c0 6.08 4.92 11 11 11s11-4.92 11-11c0-3.53-1.66-6.67-4.17-8.83z"/></svg>
            </button>
        </div>
    </div>

    <!-- 2. Apple Siri Remote Touchpad & Clickpad (Supports BOTH Tap & Touch Swipe Gestures) -->
    <div class="clickpad-section">
        <div id="touchSurface" class="clickpad-surface">
            <!-- Up Zone -->
            <button id="zoneUp" class="clickpad-zone zone-up" onclick="sendRemoteKey('up')">
                <svg viewBox="0 0 24 24" style="width: 26px; height: 26px;"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
            </button>
            <!-- Down Zone -->
            <button id="zoneDown" class="clickpad-zone zone-down" onclick="sendRemoteKey('down')">
                <svg viewBox="0 0 24 24" style="width: 26px; height: 26px;"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
            </button>
            <!-- Left Zone -->
            <button id="zoneLeft" class="clickpad-zone zone-left" onclick="sendRemoteKey('left')">
                <svg viewBox="0 0 24 24" style="width: 26px; height: 26px;"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <!-- Right Zone -->
            <button id="zoneRight" class="clickpad-zone zone-right" onclick="sendRemoteKey('right')">
                <svg viewBox="0 0 24 24" style="width: 26px; height: 26px;"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
            <!-- Center Select Dish -->
            <button id="zoneCenter" class="clickpad-center-dish" onclick="sendRemoteKey('ok')">OK</button>
        </div>
    </div>

    <!-- 3. Primary Controls Cluster (Back, Play/Pause, Mute, TV/Home + Vertical Volume Rocker) -->
    <div class="controls-cluster">
        <!-- 2x2 Function Buttons -->
        <div class="buttons-grid-2x2">
            <button class="tactile-btn" onclick="sendRemoteKey('back')">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                <span>Back</span>
            </button>
            <button class="tactile-btn" onclick="sendRemoteKey('home')">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>TV / Home</span>
            </button>
            <button class="tactile-btn" onclick="sendRemoteKey('playpause')">
                <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                <span>Pause</span>
            </button>
            <button class="tactile-btn" onclick="sendRemoteKey('mute')">
                <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                <span>Mute</span>
            </button>
        </div>

        <!-- Vertical Volume Rocker -->
        <div class="volume-column">
            <div class="vol-rocker">
                <button class="vol-part" onclick="sendRemoteKey('volup')">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
                <div class="vol-divider"></div>
                <button class="vol-part" onclick="sendRemoteKey('voldown')">
                    <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 4. Quick Channels Floating Bar -->
    <div class="channels-bar" onclick="openChannelSheet()">
        <div class="channels-label-group">
            <svg viewBox="0 0 24 24" style="color: #60a5fa;"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            <span>Quick Channels</span>
        </div>
        <span class="channels-count-badge">23 Channels</span>
    </div>

    <!-- 5. Quick App Launch Dock -->
    <div class="apps-dock">
        <div class="app-dock-pill app-telecom" onclick="launchPackage('uz.telecom.telecomtv')" title="TelecomTV">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        </div>
        <div class="app-dock-pill app-youtube" onclick="launchPackage('com.google.android.youtube.tv')" title="YouTube">
            <svg viewBox="0 0 24 24"><path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 22c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 2c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>
        </div>
        <div class="app-dock-pill app-settings" onclick="launchPackage('com.android.tv.settings')" title="Settings">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </div>
        <div class="app-dock-pill app-numpad" onclick="openNumpadSheet()" title="Numpad">
            <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zm-12 6h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/></svg>
        </div>
    </div>
</div>

<!-- Channels Bottom Sheet Modal -->
<div id="sheetOverlay" class="sheet-overlay" onclick="closeAllSheets()"></div>
<div id="channelSheet" class="modal-sheet">
    <div class="sheet-grabber"></div>
    <div class="modal-header">
        <div class="modal-title">Favorite Channels</div>
        <button class="modal-close" onclick="closeAllSheets()">✕</button>
    </div>

    <!-- Category Tabs -->
    <div class="modal-tabs">
        <div class="tab-pill active" onclick="setChannelGroup('all', this)">All</div>
        <div class="tab-pill" onclick="setChannelGroup('popular', this)">⭐ Popular</div>
        <div class="tab-pill" onclick="setChannelGroup('state', this)">National</div>
        <div class="tab-pill" onclick="setChannelGroup('entertainment', this)">Entertainment</div>
    </div>

    <div class="search-container">
        <input type="text" id="channelSearchInput" class="search-box" placeholder="Search (e.g. Milliy, 010...)" oninput="filterChannelList()">
    </div>

    <div id="channelListWrapper" class="channel-scroll"></div>
</div>

<!-- Numpad Bottom Sheet Modal -->
<div id="numpadSheet" class="modal-sheet">
    <div class="sheet-grabber"></div>
    <div class="modal-header">
        <div class="modal-title">Number Pad</div>
        <button class="modal-close" onclick="closeAllSheets()">✕</button>
    </div>
    <div class="numpad-grid">
        <button class="numpad-key" onclick="sendRemoteKey(8)">1</button>
        <button class="numpad-key" onclick="sendRemoteKey(9)">2</button>
        <button class="numpad-key" onclick="sendRemoteKey(10)">3</button>
        <button class="numpad-key" onclick="sendRemoteKey(11)">4</button>
        <button class="numpad-key" onclick="sendRemoteKey(12)">5</button>
        <button class="numpad-key" onclick="sendRemoteKey(13)">6</button>
        <button class="numpad-key" onclick="sendRemoteKey(14)">7</button>
        <button class="numpad-key" onclick="sendRemoteKey(15)">8</button>
        <button class="numpad-key" onclick="sendRemoteKey(16)">9</button>
        <button class="numpad-key numpad-action-key" onclick="sendRemoteKey('back')">DEL</button>
        <button class="numpad-key" onclick="sendRemoteKey(7)">0</button>
        <button class="numpad-key numpad-action-key" onclick="sendRemoteKey('ok')" style="color: var(--accent-blue);">ENTER</button>
    </div>
</div>

<script>
    var CHANNELS = [
        // 1-10 National Channels
        { num: "014", name: "O'zbekiston", group: "state", cat: "National", star: false },
        { num: "021", name: "Yoshlar", group: "state", cat: "National", star: false },
        { num: "019", name: "Toshkent", group: "state", cat: "National", star: false },
        { num: "007", name: "Madaniyat", group: "state", cat: "Culture", star: false },
        { num: "004", name: "Dunyo bo'ylab", group: "state", cat: "Docu", star: false },
        { num: "002", name: "Bolajon", group: "state", cat: "Kids", star: false },
        { num: "011", name: "Navo", group: "state", cat: "Music", star: false },
        { num: "008", name: "Mahalla", group: "state", cat: "National", star: false },
        { num: "006", name: "Kinoteatr", group: "state", cat: "Movies", star: false },
        { num: "000", name: "O'zbekiston 24", group: "state", cat: "News", star: false },

        // 11-15 Commercial Channels (Milliy, UzReport, Zo'r TV, MY5, Sevimli)
        { num: "010", name: "Milliy TV", group: "popular", cat: "Popular", star: true },
        { num: "020", name: "UzReport HD", group: "popular", cat: "News HD", star: true },
        { num: "024", name: "Zo'r TV", group: "popular", cat: "Popular", star: true },
        { num: "009", name: "MY5", group: "popular", cat: "Youth", star: true },
        { num: "016", name: "Sevimli TV", group: "popular", cat: "Family", star: true },

        // 16-23 Entertainment & Culture
        { num: "001", name: "Aqlvoy", group: "entertainment", cat: "Kids", star: false },
        { num: "018", name: "Taraqqiyot", group: "entertainment", cat: "Culture", star: false },
        { num: "003", name: "Dasturxon", group: "entertainment", cat: "Food", star: false },
        { num: "026", name: "Renessans", group: "entertainment", cat: "Culture", star: false },
        { num: "025", name: "Nurafshon", group: "entertainment", cat: "Regional", star: false },
        { num: "005", name: "FTV HD", group: "entertainment", cat: "Music", star: false },
        { num: "452", name: "QIZIQ TV", group: "entertainment", cat: "Humor", star: false },
        { num: "012", name: "O'zbekiston Tarixi", group: "entertainment", cat: "History", star: false }
    ];

    var activeGroup = 'all';
    var audioFeedbackOn = false;
    var audioContext = null;

    // Synthesize satisfying Apple tactile click
    function playClickSynth() {
        if (!audioFeedbackOn) return;
        try {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            var osc = audioContext.createOscillator();
            var gain = audioContext.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioContext.currentTime + 0.022);
            gain.gain.setValueAtTime(0.18, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.022);
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.022);
        } catch (e) {}
    }

    function toggleAudioFeedback() {
        audioFeedbackOn = !audioFeedbackOn;
        var btn = document.getElementById('audioToggle');
        var txt = document.getElementById('audioStatusText');
        if (audioFeedbackOn) {
            btn.classList.add('active');
            txt.innerText = 'Click: On';
            playClickSynth();
        } else {
            btn.classList.remove('active');
            txt.innerText = 'Click: Off';
        }
    }

    function haptic() {
        playClickSynth();
        if (window.navigator && window.navigator.vibrate) {
            window.navigator.vibrate(10);
        }
    }

    function sendRemoteKey(key) {
        haptic();
        fetch('/api/key?name=' + encodeURIComponent(key), {
            method: 'POST'
        }).catch(function(e) {
            console.error('Key error', e);
        });
    }

    function launchPackage(pkg) {
        haptic();
        fetch('/api/launch?pkg=' + encodeURIComponent(pkg), {
            method: 'POST'
        }).catch(function(e) {
            console.error('Launch error', e);
        });
    }

    /* Swipe Gesture Support on Clickpad (Apple TV Touch Surface) */
    var touchSurface = document.getElementById('touchSurface');
    var startX = 0, startY = 0, startTime = 0;
    var hasMoved = false;

    touchSurface.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            startTime = Date.now();
            hasMoved = false;
        }
    }, { passive: true });

    touchSurface.addEventListener('touchmove', function(e) {
        if (e.touches.length === 1) {
            var dx = e.touches[0].clientX - startX;
            var dy = e.touches[0].clientY - startY;
            if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
                hasMoved = true;
            }
        }
    }, { passive: true });

    touchSurface.addEventListener('touchend', function(e) {
        if (!hasMoved) return; // let standard tap click events fire
        var endX = e.changedTouches[0].clientX;
        var endY = e.changedTouches[0].clientY;
        var dx = endX - startX;
        var dy = endY - startY;
        var elapsed = Date.now() - startTime;

        var threshold = 28;
        if (elapsed < 400 && (Math.abs(dx) > threshold || Math.abs(dy) > threshold)) {
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) {
                    highlightZone('zoneRight');
                    sendRemoteKey('right');
                } else {
                    highlightZone('zoneLeft');
                    sendRemoteKey('left');
                }
            } else {
                if (dy > 0) {
                    highlightZone('zoneDown');
                    sendRemoteKey('down');
                } else {
                    highlightZone('zoneUp');
                    sendRemoteKey('up');
                }
            }
        }
    }, { passive: true });

    function highlightZone(id) {
        var el = document.getElementById(id);
        if (el) {
            el.classList.add('pressed');
            setTimeout(function() { el.classList.remove('pressed'); }, 120);
        }
    }

    /* Bottom Sheet Logic */
    function openChannelSheet() {
        haptic();
        document.getElementById('sheetOverlay').classList.add('visible');
        document.getElementById('channelSheet').classList.add('visible');
        document.getElementById('channelSearchInput').value = '';
        filterChannelList();
    }

    function openNumpadSheet() {
        haptic();
        document.getElementById('sheetOverlay').classList.add('visible');
        document.getElementById('numpadSheet').classList.add('visible');
    }

    function closeAllSheets() {
        haptic();
        document.getElementById('sheetOverlay').classList.remove('visible');
        document.getElementById('channelSheet').classList.remove('visible');
        document.getElementById('numpadSheet').classList.remove('visible');
    }

    function setChannelGroup(grp, tabEl) {
        haptic();
        activeGroup = grp;
        document.querySelectorAll('.tab-pill').forEach(function(t) { t.classList.remove('active'); });
        tabEl.classList.add('active');
        filterChannelList();
    }

    function filterChannelList() {
        var q = document.getElementById('channelSearchInput').value.toLowerCase().trim();
        var list = CHANNELS;

        if (activeGroup !== 'all') {
            list = list.filter(function(c) { return c.group === activeGroup; });
        }

        if (q) {
            list = list.filter(function(c) {
                return c.name.toLowerCase().includes(q) || c.num.includes(q) || c.cat.toLowerCase().includes(q);
            });
        }

        renderChannelItems(list);
    }

    function renderChannelItems(list) {
        var wrapper = document.getElementById('channelListWrapper');
        wrapper.innerHTML = '';
        list.forEach(function(ch) {
            var row = document.createElement('div');
            row.className = 'channel-row';
            row.onclick = function() {
                tuneChannel(ch.num, ch.name);
            };

            var left = document.createElement('div');
            left.className = 'channel-info-left';

            var badge = document.createElement('span');
            badge.className = 'channel-digit-tag' + (ch.star ? ' star-tag' : '');
            badge.innerText = ch.num;

            var title = document.createElement('span');
            title.className = 'channel-title';
            title.innerText = ch.name;

            left.appendChild(badge);
            left.appendChild(title);

            var tag = document.createElement('span');
            tag.className = 'channel-subtag';
            tag.innerText = ch.cat;

            row.appendChild(left);
            row.appendChild(tag);
            wrapper.appendChild(row);
        });
    }

    function showToast(msg) {
        var t = document.getElementById('toast');
        document.getElementById('toastText').innerText = msg;
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 1600);
    }

    function tuneChannel(num, name) {
        haptic();
        showToast('Tuning to ' + name + ' (' + num + ')');
        fetch('/api/tune?num=' + encodeURIComponent(num), { method: 'POST' }).catch(function(e) {});
        setTimeout(function() { closeAllSheets(); }, 180);
    }

    // Initial render
    renderChannelItems(CHANNELS);
</script>

</body>
</html>
